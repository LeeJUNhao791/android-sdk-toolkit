import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

String sha256(File file) {
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, count)
        }
    }
    return digest.digest().encodeHex().toString()
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register('verifySdkHandoff') {
        doLast {
            def coordinate = root.providers.gradleProperty('toolkitCoordinate').get()
            def (group, module, version) = coordinate.split(':')
            def published = new File(root.providers.gradleProperty('toolkitExpectedArtifact').get())
            def expectedHash = sha256(published)
            def isAndroid = published.name.endsWith('.aar')
            def selector = root.providers.gradleProperty('toolkitConsumerTask').get()
            def targets = gradle.taskGraph.allTasks.findAll { task ->
                task.path == selector || task.name == selector
            }
            if (targets.size() != 1) {
                throw new GradleException(
                    "Choose one consumer task with --consumer-task. '${selector}' matched ${targets*.path}."
                )
            }
            def target = targets[0]
            def runtime = isAndroid
                ? target.name.substring('assemble'.length()).uncapitalize() + 'RuntimeClasspath'
                : 'runtimeClasspath'
            def configuration = target.project.configurations.findByName(runtime)
            def context = "${target.path} (${runtime})"
            if (!configuration?.canBeResolved) {
                throw new GradleException(
                    "Consumer did not resolve the matching published artifact ${coordinate} for ${context}. " +
                    'Choose a task with its own runtime classpath using --consumer-task.'
                )
            }
            def view = configuration.incoming.artifactView {
                componentFilter { id ->
                    id instanceof ModuleComponentIdentifier &&
                        id.group == group && id.module == module && id.version == version
                }
            }
            def matched = view.files.files.any { file ->
                file.isFile() && sha256(file) == expectedHash
            }
            if (!matched) {
                throw new GradleException(
                    "Consumer did not resolve the matching published artifact ${coordinate} for ${context}."
                )
            }
            logger.lifecycle("Verified consumer runtime artifact ${coordinate} for ${context}")
        }
    }
}
