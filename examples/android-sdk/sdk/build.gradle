plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'io.github.leejunhao791.sdktoolkit'
version = '0.1.0'

android {
    namespace 'io.github.leejunhao791.sdktoolkit'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    publishing {
        singleVariant('release')
    }
}

publishing {
    repositories {
        maven {
            name = 'handoff'
            url = uri(providers.gradleProperty('toolkitRepo').getOrElse(
                layout.buildDirectory.dir('handoff-repo').get().asFile.absolutePath
            ))
        }
    }
}

afterEvaluate {
    publishing.publications.create('release', MavenPublication) {
        artifactId = 'device-sdk'
        from components.release
    }
}
